name: Tesseract
options:
  bundleIdPrefix: com.tesseract
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Lint build phase greps the source tree — sandboxing would block it.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # ANELoop.metal's CPU/GPU parity contract requires IEEE float ops
    # in program order (no reassociation/fma contraction): the SIMT
    # visit law mirrors ANELoop.sweepBlockCPU statement for statement
    # (strict decrease only, ties keep the current index), and
    # reassociation would perturb those acceptance comparisons.
    # Gated by ANELoopSIMTParityTests (agreement up to score near-ties,
    # XP2; never bit-exactness across precisions).
    # (Was justified by Refine.metal until 2026-08-12, when the
    # per-frame-palette decree deleted that kernel. The contract moved
    # files; it did not go away. This is NOT a free perf knob.)
    MTL_FAST_MATH: NO
    # No App Intents in this app — skips the appintentsmetadataprocessor
    # pass and its "Metadata extraction skipped" warning on every build.
    LM_SKIP_METADATA_EXTRACTION: YES
    # Daniel Mosquera personal team — the cached wildcard profile (9WANULVN2G.*)
    # on this machine signs device builds offline; no Xcode account needed.
    DEVELOPMENT_TEAM: 9WANULVN2G
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Tesseract:
    type: application
    platform: iOS
    sources:
      - path: Tesseract
    preBuildScripts:
      - name: "GRID constitution lint"
        script: bash "${PROJECT_DIR}/scripts/lint-grid.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesseract.app
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSCameraUsageDescription: "Tesseract uses the front TrueDepth camera to make GIFs: depth drives the LIVE cadence, the ARKit face mesh drives the FACE cadence."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Tesseract saves the GIFs you keep to your photo library."
        # Export compliance: no non-exempt encryption (on-device image
        # processing only) — skips the App Store Connect prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Store-level device cut (2026-08-12): Apple has NO capability key
        # for the Center Stage camera (or TrueDepth), so the App Store
        # cannot cut exactly at the iPhone 17 line. gaming-tier = A17 Pro
        # and later (iPhone 15 Pro+) is the tightest published key; the
        # runtime CENTER STAGE gate finishes the job on 15 Pro/16-line
        # devices, and the store description states the real requirement.
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: ["arm64", "front-facing-camera", "iphone-performance-gaming-tier"]
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "Tesseract"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule

  TesseractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TesseractTests
    dependencies:
      - target: Tesseract
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesseract.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tesseract.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tesseract"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Tesseract:
    build:
      targets:
        Tesseract: all
        TesseractTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TesseractTests
    archive:
      config: Release
